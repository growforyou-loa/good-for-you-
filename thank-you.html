<!DOCTYPE html>
<html lang="en">
<head>
<title>Request Received — Good for You</title>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --primary: #6366f1;
    --secondary: #22d3ee;
    --accent: #22c55e;
    --text: #e5e7eb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,system-ui,sans-serif;
}

body{
  background:
    radial-gradient(circle at 70% 30%, rgba(34,211,238,0.15), transparent 40%),
    linear-gradient(160deg,#030712 0%,#0b1120 100%);
  color:var(--text);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

.thank-you-card {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 60px 40px;
    max-width: 500px;
    width: 90%;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    animation: cardEntry 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes cardEntry {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.success-icon {
    width: 80px;
    height: 80px;
    background: rgba(34, 197, 94, 0.1);
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 30px;
    color: var(--accent);
    font-size: 40px;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
}

h1 {
    font-size: 2.2rem;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #ffffff, var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    opacity: 0.7;
    line-height: 1.7;
    margin-bottom: 35px;
}

.btn-home {
    display: inline-block;
    padding: 16px 40px;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
}

.btn-home:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(34, 211, 238, 0.4);
}

</style>
</head>
<body>

<div class="thank-you-card">
    <div class="success-icon">✓</div>
    <h1>Thank You!</h1>
    <p>Your request has been received. Our team will review your message and get back to you via email shortly.</p>
    <a href="/" class="btn-home">Back to Home</a>
</div>

</body>
</html>
